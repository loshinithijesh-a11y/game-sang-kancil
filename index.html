ght:13%;left:58%;top:42%;transform-origin:50% 95%;background:linear-gradient(115deg,#f5bc67,#b46b36);border:2px solid #7a482c;border-radius:65% 65% 30% 30%;animation:pawWave .38s ease-in-out infinite alternate;pointer-events:none}@keyframes pawWave{from{transform:rotate(-35deg)}to{transform:rotate(37deg)}}.hidden{display:none!important}

/* Animasi suasana — lapisan tambahan, tidak mengganggu kamera atau kawalan */
.atmosphere{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.atmosphere svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.atmo-ripple{fill:none;stroke:#dcffff;stroke-width:2;opacity:0;animation:waterFlow 5.4s ease-out infinite}
.atmo-ripple:nth-child(2n){animation-delay:-2.6s}
@keyframes waterFlow{0%{opacity:0;transform:translateX(-22px) scaleX(.78)}25%{opacity:.48}85%{opacity:.22}100%{opacity:0;transform:translateX(35px) scaleX(1.18)}}

.animated-deer{animation:deerWalk .38s ease-in-out infinite alternate;transform-origin:50% 90%;will-change:left,transform}

.animated-turtle.moving{animation:turtleWalk .46s ease-in-out infinite alternate;will-change:top,left,transform}

.animated-fruit{object-fit:contain!important;border-radius:0!important;background:transparent!important;filter:drop-shadow(0 4px 3px #142c2780)!important}

.celebrate-card.fail{background:linear-gradient(145deg,#33475f,#485a71);border-color:#bce3ff}

.confetti{position:absolute;top:-10%;left:var(--x);width:12px;height:22px;background:var(--c);transform:rotate(var(--r));animation:confettiFall var(--t) linear infinite;animation-delay:var(--d);pointer-events:none}
@keyframes confettiFall{to{top:115%;transform:translateX(90px) rotate(800deg)}}
@keyframes cheer{to{transform:translateY(-9px) scale(1.07)}}

@keyframes deerStep{0%{transform:scaleX(var(--facing,1)) translateY(0) rotate(-1deg)}50%{transform:scaleX(var(--facing,1)) translateY(-7px) rotate(1.5deg)}100%{transform:scaleX(var(--facing,1)) translateY(0) rotate(-1deg)}}
.animated-deer{animation:deerStep .52s ease-in-out infinite;filter:drop-shadow(0 8px 5px #17352270)}
.animated-deer.resting{animation-play-state:paused}
@keyframes turtleStep{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.animated-turtle.moving{animation:turtleStep .65s ease-in-out infinite}
.animated-turtle{filter:drop-shadow(0 6px 5px #17352280);transition:left .13s linear,top .13s linear}

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id), MODEL='https://teachablemachine.withgoogle.com/models/XUNpE-usV/';
const bg=$('bg'),field=$('field'),status=$('status'),msg=$('msg'),hud=$('hud'),panel=$('panel'),cursor=$('cursor'),video=$('video');
let handFrameBusy=false,lastHandFrame=0;
let page='home',stage=0,cam=null,hands=null,tm=null,tmBusy=false,streamStarted=false,landmarks=null,handPresent=false,lastHandAt=0,handX=.5,handY=.5,pinch=false,prevPinch=false,fingers=0,fingerCandidate=-1,fingerSince=0,stableFingers=0,grab=-1,fruits=[],waveXs=[],waveTime=0,trail=[],turtle={x:.17,y:.58},bodyMove='diam',lastBodyAt=0,stage3Progress=0,stageStart=0,completed=new Set(),scores={finger:false,pinch:false,draw:false,wave:false};
const img=n=>`assets/PIC ${n}.jpg`;
function boxHit(el,x,y,w,h,fn){el.style.left=x+'%';el.style.top=y+'%';el.style.width=w+'%';el.style.height=h+'%';el.onclick=fn;el.classList.remove('hidden')}
function hideHit(el){el.classList.add('hidden');el.onclick=null}
function say(s){/* Narasi AI dinyahaktifkan sepenuhnya; rakaman sebenar digunakan. */}
function info(s){msg.textContent=s;msg.classList.remove('hidden')}
function clear(){field.replaceChildren();hideHit($('primary'));hideHit($('back'));hideHit($('teacher'));$('levels').replaceChildren();panel.classList.add('hidden');status.classList.add('hidden');msg.classList.add('hidden');cursor.style.display='none';hud.classList.add('hidden');grab=-1;trail=[]}
function screen(p){clearTimeout(levelTimer);$('celebrate').classList.add('hidden');page=p;clear();playVoice(p);let n={home:1,how:2,choose:3,oneIntro:4,one:5,twoIntro:6,two:7,threeIntro:8,three:9,fourIntro:10,four:11,teacher:12}[p];bg.src=img(n);renderAtmosphere(p);if(p==='home'){boxHit($('primary'),42,86,17,12,()=>screen('how'))}else if(p==='how'){boxHit($('primary'),37,84,27,14,()=>screen('choose'))}else if(p==='choose'){let lev=[['oneIntro',21,27],['twoIntro',36,27],['threeIntro',51,27],['fourIntro',66,27]];lev.forEach(([dest,x,y],i)=>{let b=document.createElement('button');b.className='hit';b.setAttribute('aria-label','Tahap '+(i+1));boxHit(b,x,y,14,31,()=>screen(dest));$('levels').append(b)});boxHit($('teacher'),46,87,27,11,openTeacherGuide)}else if(p.endsWith('Intro')){boxHit($('primary'),73,80,25,17,()=>screen(p.replace('Intro','')));boxHit($('back'),1,85,20,13,()=>screen('choose'))}else if(['one','two','three','four'].includes(p)){stage={one:1,two:2,three:3,four:4}[p];stageStart=performance.now();if(stage===1){stableFingers=0;fingerCandidate=-1;bodyMove='diam';lastPredictionAt=0}hud.classList.remove('hidden');status.classList.remove('hidden');boxHit($('back'),1,89,18,10,()=>screen('choose'));setupStage();levelTimer=setTimeout(()=>{if(!resultShown&&['one','two','three','four'].includes(page))showLevelResult(false)},120000);if(stage===1){if(tm){showMapping();$('modelStatus').textContent='Model POSE aktif — mengesan badan...'}else if(streamStarted){loadModel()}else{$('modelStatus').textContent='Model belum dimuat — hidupkan kamera dahulu'}}if(!streamStarted)info('Klik “Hidupkan kamera”, kemudian benarkan akses kamera.');else info(instruction());say(instruction())}else if(p==='teacher'){boxHit($('back'),1,87,16,12,()=>screen('choose'));boxHit($('primary'),74,81,24,16,saveAssessment);assessment()}}

function renderAtmosphere(p){
 const host=document.getElementById('atmosphere');
 host.replaceChildren();
 const active=['one','two','three','four'].includes(p);
 if(!active)return;
 const make=(tag,cls,style,markup)=>{
   let el=document.createElement(tag);el.className=cls;
   if(style)el.style.cssText=style;
   if(markup)el.innerHTML=markup;
   host.append(el);return el;
 };
 // Riak sungai yang bergerak tanpa menutup ilustrasi asal.
 if(p==='one'){
   const lines=[[27,73],[38,79],[51,74],[66,78],[81,76],[92,82],[45,89],[69,90]];
   let paths=lines.map(([x,y],i)=>`<path class="atmo-ripple" style="animation-delay:${(-i*.68).toFixed(2)}s" d="M${x-5} ${y}q5 -3 10 0"/>`).join('');
   make('div','', 'position:absolute;inset:0',`<svg viewBox="0 0 100 100" preserveAspectRatio="none">${paths}</svg>`);
   // Senyuman / kelipan buaya sebagai lapisan halus, bukan menggantikan imej buaya asal.
   make('div','atmo-croc','',`<svg viewBox="0 0 170 100" preserveAspectRatio="none">
      <path class="croc-smile" d="M38 60 Q75 80 125 58" fill="none" stroke="#315a36" stroke-width="3.3" stroke-linecap="round" opacity=".75"/>
      <ellipse class="croc-eye" cx="65" cy="35" rx="5" ry="6" fill="#173d2d" opacity=".72"/>
      <ellipse class="croc-eye" cx="112" cy="31" rx="5" ry="6" fill="#173d2d" opacity=".72"/>
   </svg>`);
 }
 if(p==='two'){
   make('div','atmo-waterfall','');
 }
 // Daun terbang, dedaunan bergoyang dan kelip-kelip.
 for(let i=0;i<7;i++){
   const x=[5,18,36,52,67,82,95][i],y=[8,2,15,6,3,11,7][i];
   make('div','atmo-leaf',`left:${x}%;top:${y}%;--dur:${9+i*1.3}s;--delay:${-i*2.1}s`);
 }
 const branchSvg='<svg viewBox="0 0 180 100"><path d="M0 0Q65 38 160 38" fill="none" stroke="#4e8e53" stroke-width="7"/><ellipse cx="70" cy="20" rx="24" ry="9" fill="#85cb64"/><ellipse cx="116" cy="27" rx="22" ry="10" fill="#d8c85a"/><ellipse cx="148" cy="33" rx="18" ry="9" fill="#60b66d"/></svg>';
 make('div','atmo-branch','',branchSvg);
 make('div','atmo-branch right','',branchSvg);
 for(let i=0;i<6;i++){
   make('div','atmo-glow',`left:${[17,30,45,63,76,89][i]}%;top:${[35,57,27,68,42,60][i]}%;animation-delay:${-i*.7}s`);
 }

function countFinger(l){let up=0;for(let [tip,pip,mcp] of [[8,6,5],[12,10,9],[16,14,13],[20,18,17]]){let a=dist(l[tip],l[0]),b=dist(l[pip],l[0]);if(a>b*1.12 && dist(l[tip],l[mcp])>dist(l[pip],l[mcp])*1.18)up++}let thumbExtended=dist(l[4],l[17])>dist(l[3],l[17])*1.12 && dist(l[4],l[5])>dist(l[3],l[5])*1.1;return up+(thumbExtended?1:0)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function handleFruit(){if(!prevPinch&&pinch&&grab<0){let best=-1,bd=.12;fruits.forEach((f,i)=>{if(f.done)return;let d=Math.hypot(handX-(f.x+.042),handY-(f.y+.06));if(d<bd){best=i;bd=d}});grab=best;if(grab>=0)fruits[grab].el.classList.add('grabbed')}if(grab>=0){let f=fruits[grab];if(pinch){f.x=Math.max(0,Math.min(.92,handX-.042));f.y=Math.max(0,Math.min(.86,handY-.06));placeFruit(f)}else releaseFruit()}}
